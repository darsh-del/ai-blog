[pytest]
# Bare `pytest` (no __init__.py in tests/, no root conftest.py doing sys.path
# tricks) does not put the project root on sys.path, only `python -m pytest`
# does — so `from src.agents import ...` in tests/test_suite.py fails with
# ModuleNotFoundError under a plain `pytest` invocation (CI, most IDEs).
# This is the one shared fix point for every caller: CI, local `pytest`, and
# IDE test runners all read this file.
pythonpath = .
