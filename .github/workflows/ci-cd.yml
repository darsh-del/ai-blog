name: CI/CD

# Pipeline shape:
#   test        -> runs on every push and PR (fast feedback, no Docker needed —
#                  the test suite mocks all external clients, see tests/conftest.py)
#   build-push  -> only on push to main, after tests pass: builds the runtime
#                  image once and publishes it to GHCR (EC2 pulls this, it never
#                  rebuilds on the box)
#   deploy      -> only on push to main, after build-push: SSHes into the EC2
#                  host, pulls the new image, restarts the stack, smoke-tests it,
#                  and rolls back automatically if the smoke test fails
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'documentation/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      redeploy_only:
        description: "Skip build, just redeploy the currently published :latest image"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest pip-audit

      - name: Pylint (informational — repo has pre-existing debt, doesn't gate the build)
        run: pylint src utils prompts *.py --exit-zero

      - name: pip-audit (informational — flags known-CVE dependencies)
        run: pip-audit -r requirements.txt || true

      - name: pytest
        run: pytest tests/ -v

  build-push:
    name: Build & push image
    needs: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.redeploy_only != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Trivy filesystem scan (deps/config — informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "0"

  deploy:
    name: Deploy to EC2
    needs: build-push
    # Runs after a successful build, OR standalone when someone manually asks
    # for a redeploy of whatever :latest already is (no rebuild).
    if: |
      always() &&
      (needs.build-push.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.redeploy_only == 'true'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Resolve image tag to deploy
        id: resolve
        run: |
          echo "tag=${{ needs.build-push.outputs.image_tag || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH (pull image, restart, smoke-test, auto-rollback)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR,NEW_TAG
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.EC2_DEPLOY_DIR }}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Remember the currently-running tag so we can roll back to it.
            PREV_TAG=$(grep -oP '^IMAGE_TAG=\K.*' .env 2>/dev/null || echo "latest")
            echo "Currently running: $PREV_TAG -> deploying: $NEW_TAG"

            # .env is also compose's own interpolation file (see docker-compose.yml's
            # ${IMAGE_TAG} reference) — this is the one line CI is allowed to touch in it.
            if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${NEW_TAG}/" .env
            else
              echo "IMAGE_TAG=${NEW_TAG}" >> .env
            fi

            docker compose pull blog-generator
            docker compose up -d --no-build --remove-orphans

            # Smoke test: container must come up and stay up (catches immediate
            # crash-loops / missing env vars), and the cron entry setup_cron.py
            # registers on entrypoint must actually be there.
            ROLLBACK=0
            sleep 15
            if [ "$(docker inspect -f '{{.State.Running}}' blog-generator-api 2>/dev/null)" != "true" ]; then
              echo "Container is not running after deploy."
              ROLLBACK=1
            elif ! docker exec blog-generator-api crontab -l 2>/dev/null | grep -q 'ai-blog-generator:generate_and_email'; then
              echo "Cron entry missing after deploy."
              ROLLBACK=1
            fi

            if [ "$ROLLBACK" = "1" ]; then
              echo "Smoke test failed — rolling back to $PREV_TAG"
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREV_TAG}/" .env
              docker compose up -d --no-build --remove-orphans
              docker logs --tail 100 blog-generator-api || true
              exit 1
            fi

            echo "Deploy OK: running $NEW_TAG"
            docker image prune -af --filter "until=168h"
